name: tests
on: [push, pull_request]
jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, ldap, mbstring, xml, dom, simplexml
      - run: composer install --working-dir=src --no-interaction --prefer-dist
      - run: src/vendor/bin/phpunit --configuration tests/phpunit.xml
